<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Quote</title><link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E242C;--muted:#5F6874;--line:#E3E6EA;--bg:#F4F6F8;--panel:#fff;--navy:#0E1B33;--teal:#0B8277;--bad:#B3261E;--ok:#1C7C4A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E8ECF2;--muted:#9AA4B2;--line:#2A3446;--bg:#0D131F;--panel:#141C2B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:18px 16px}header .in{max-width:860px;margin:auto;display:flex;align-items:center;gap:12px}header img{height:36px;border-radius:6px;background:#fff;padding:3px}
header b{font:600 1.15rem Sora,sans-serif}main{max-width:860px;margin:20px auto;padding:0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}h1{font:600 1.5rem/1.25 Sora,sans-serif;margin:0 0 4px}
.mut{color:var(--muted)}table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.75rem;text-transform:uppercase;color:var(--muted)}.num{text-align:right;white-space:nowrap}
tr.t td{font-weight:600;border-bottom:0}.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:#E0F2F1;color:var(--teal);font-size:.8rem;font-weight:600}
input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}textarea{min-height:90px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{font:600 1rem "IBM Plex Sans",sans-serif;border-radius:10px;border:1px solid var(--line);padding:11px 18px;cursor:pointer;background:var(--panel);color:var(--ink)}
button.p{background:var(--teal);border-color:var(--teal);color:#fff}button.d{color:var(--bad)}button:disabled{opacity:.5}.msg{margin-top:10px;font-weight:500}.pre{white-space:pre-wrap}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
</style></head><body>
<header><div class="in"><img id="logo" alt="" hidden><b id="co">Quote</b></div></header>
<main id="m"><div class="card">Loading the quote…</div></main>
<footer>Sent with Orzio</footer>
<script>
(function(){const t=new URLSearchParams(location.search).get('t')||'';const m=document.getElementById('m');const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const d=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const BT={full_advance:'100% on acceptance',advance_balance:'Advance, balance on completion',milestones:'Milestones',monthly:'Monthly fee',on_completion:'100% on completion',time:'Time and materials (monthly)'};
fetch('/api/quote?t='+encodeURIComponent(t)).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{if(!ok){m.innerHTML='<div class="card">'+esc(j.error||'This quote could not be found.')+'</div>';return;}
 const q=j.quote,c=j.company||{};document.getElementById('co').textContent=c.name||'Quote';document.title='Quote '+q.number+' · '+(c.name||'');if(c.logo&&/^data:image|^https:/.test(c.logo)){const l=document.getElementById('logo');l.src=c.logo;l.hidden=false;}
 const net=(q.lines||[]).reduce((s,l)=>s+(+l.qty||0)*(+l.price||0),0),vat=(q.lines||[]).reduce((s,l)=>s+(+l.qty||0)*(+l.price||0)*(+l.vat||0)/100,0);const b=q.billing||{};
 const bill=b.type==='advance_balance'?(b.advance_pct||50)+'% advance on signing, balance on completion':b.type==='milestones'?(b.milestones||[]).map(x=>x.pct+'% '+x.name).join(', '):BT[b.type]||'';
 const open=q.status==='sent';const st={sent:'Waiting for your answer',accepted:'Accepted',change_requested:'Changes requested',declined:'Declined'}[q.status]||q.status;
 m.innerHTML=`<div class="card"><div class="mut">Quote ${esc(q.number)}${q.version>1?' · version '+q.version:''} · valid until ${esc(d(q.valid_until))}</div><h1>${esc(q.title)}</h1><div class="mut">For ${esc(q.customer)}</div><p><span class="pill">${esc(st)}</span></p></div>
 <div class="card"><h3>Scope of work</h3><div class="pre">${esc(q.scope)}</div>${q.deliverables?`<h3>Deliverables</h3><div class="pre">${esc(q.deliverables)}</div>`:''}</div>
 <div class="card"><table><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Amount</th></tr></thead><tbody>${(q.lines||[]).map(l=>`<tr><td>${esc(l.desc)}</td><td class="num">${esc(l.qty)}</td><td class="num">${fmt(l.price)}</td><td class="num">${fmt(l.qty*l.price)}</td></tr>`).join('')}
 <tr><td colspan="3" class="num mut">Net</td><td class="num">${fmt(net)}</td></tr><tr><td colspan="3" class="num mut">VAT</td><td class="num">${fmt(vat)}</td></tr><tr class="t"><td colspan="3" class="num">Total ${esc(q.currency||'')}</td><td class="num">${fmt(net+vat)}</td></tr></tbody></table>
 <p><b>Billing:</b> ${esc(bill)} · payment within ${esc(b.payment_days||30)} days of invoice.</p>${q.notes?`<p class="pre mut">${esc(q.notes)}</p>`:''}</div>
 ${open?`<div class="card"><h3>Your answer</h3><input id="nm" placeholder="Your full name"><div style="height:10px"></div><textarea id="cm" placeholder="Comments, or the changes you need"></textarea><div class="row"><button class="p" data-a="accept">Accept the quote</button><button data-a="changes">Request changes</button><button class="d" data-a="decline">Decline</button></div><div class="msg" id="msg"></div><p class="mut" style="font-size:.85rem">By accepting, you agree to the quote. ${esc(c.name||'The company')} will send the service agreement for signature.</p></div>`:''}
 <div class="card mut" style="font-size:.9rem">${esc(c.name||'')}${c.address?' · '+esc(c.address):''}${c.trn?' · TRN '+esc(c.trn):''}${c.email?' · '+esc(c.email):''}${c.phone?' · '+esc(c.phone):''}</div>`;
 m.querySelectorAll('button[data-a]').forEach(btn=>btn.onclick=async()=>{const a=btn.dataset.a,nm=document.getElementById('nm').value.trim(),cm=document.getElementById('cm').value.trim(),msg=document.getElementById('msg');if(!nm){msg.textContent='Enter your name.';return;}if(a==='changes'&&!cm){msg.textContent='Describe the changes you need.';return;}
  m.querySelectorAll('button').forEach(x=>x.disabled=true);const r=await fetch('/api/quote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t,action:a,name:nm,comment:cm})});const j2=await r.json().catch(()=>({}));
  if(!r.ok){msg.textContent=j2.error||'Your answer could not be saved.';m.querySelectorAll('button').forEach(x=>x.disabled=false);return;}msg.style.color='var(--ok)';msg.textContent=a==='accept'?'Thank you! The quote is accepted. You will receive the service agreement shortly.':a==='changes'?'Thank you. Your changes were sent; you will receive a revised quote.':'Your answer was recorded.';});
}).catch(()=>{m.innerHTML='<div class="card">The quote could not be loaded. Check your connection.</div>';});})();
</script></body></html>
