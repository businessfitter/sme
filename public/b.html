<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Book an appointment</title><link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213A;--muted:#5A6577;--line:#E1E6EE;--bg:#F4F6FA;--panel:#fff;--navy:#0E1B33;--teal:#0F766E;--bad:#B3261E;--ok:#1C7C4A}
@media (prefers-color-scheme:dark){:root{--ink:#E6EBF3;--muted:#9AA6BA;--line:#253045;--bg:#0D131F;--panel:#151D2C}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
header{background:linear-gradient(120deg,var(--navy),#134E4A);color:#fff;padding:22px 16px 28px}header .in{max-width:620px;margin:auto;display:flex;gap:12px;align-items:center}
header img{height:42px;width:42px;object-fit:contain;border-radius:10px;background:#fff;padding:4px}.co{font:600 1.2rem Sora,sans-serif}.sub{opacity:.8;font-size:.9rem}
main{max-width:620px;margin:-14px auto 0;padding:0 16px 24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--muted);font-weight:500;margin:10px 0 4px}input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.docs{display:grid;gap:8px}.doc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}.doc.on{border-color:var(--teal);box-shadow:0 0 0 2px rgba(15,118,110,.2)}
button{font:600 1rem "IBM Plex Sans",sans-serif;border-radius:12px;border:0;padding:13px 18px;cursor:pointer;background:var(--teal);color:#fff;width:100%;margin-top:14px}button:disabled{opacity:.5}
.msg{margin-top:10px;font-weight:500}.mut{color:var(--muted);font-size:.85rem}footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 16px 28px}
</style></head><body>
<header><div class="in"><img id="logo" alt="" hidden><div><div class="co" id="co">Book an appointment</div><div class="sub" id="sub">Choose a doctor and a day. The clinic will call you to confirm the time.</div></div></div></header>
<main id="m"><div class="card">Loading…</div></main><footer>Booking with Orzio</footer>
<script>
(function(){const t=new URLSearchParams(location.search).get('t')||'';const m=document.getElementById('m');const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
fetch('/api/booking?t='+encodeURIComponent(t)).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{if(!ok){m.innerHTML='<div class="card">'+esc(j.error)+'</div>';return;}
  const c=j.company||{};document.getElementById('co').textContent=c.name||'Clinic';document.title='Book · '+(c.name||'');if(c.logo&&/^data:image|^https:/.test(c.logo)){const l=document.getElementById('logo');l.src=c.logo;l.hidden=false;}
  let doc=(j.doctors[0]||{}).id||'';const today=new Date().toISOString().slice(0,10),max=new Date(Date.now()+60*864e5).toISOString().slice(0,10);
  m.innerHTML=`<div class="card"><label>Doctor</label><div class="docs">${(j.doctors||[]).map(d=>`<div class="doc${d.id===doc?' on':''}" data-id="${esc(d.id)}"><div><b>${esc(d.name)}</b><div class="mut">${esc(d.specialty||'')}${(d.days||[]).length?' · '+d.days.map(x=>DN[x]).join(', '):''}${d.start?' · '+esc(d.start)+'–'+esc(d.end||''):''}</div></div></div>`).join('')||'<div class="mut">Any available doctor</div>'}</div>
   <label for="dt">Day</label><input id="dt" type="date" min="${today}" max="${max}" value="${today}"><label for="nm">Your name</label><input id="nm" autocomplete="name"><label for="ph">Phone (WhatsApp if possible)</label><input id="ph" type="tel" autocomplete="tel">
   <label for="nt">Reason for the visit (optional)</label><textarea id="nt" rows="2"></textarea><button id="go">Request appointment</button><div class="msg" id="msg"></div><p class="mut">Your details go only to ${esc(c.name||'the clinic')}. In an emergency, go to the nearest hospital.</p></div>`;
  m.querySelectorAll('.doc').forEach(x=>x.onclick=()=>{doc=x.dataset.id;m.querySelectorAll('.doc').forEach(y=>y.classList.toggle('on',y===x));});
  document.getElementById('go').onclick=async()=>{const g=document.getElementById('go'),msg=document.getElementById('msg');g.disabled=true;msg.textContent='';
    const r=await fetch('/api/booking',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t,doctor:doc,date:document.getElementById('dt').value,name:document.getElementById('nm').value,phone:document.getElementById('ph').value,note:document.getElementById('nt').value})});const k=await r.json().catch(()=>({}));
    if(!r.ok){msg.style.color='var(--bad)';msg.textContent=k.error||'It could not be sent.';g.disabled=false;return;}msg.style.color='var(--ok)';msg.textContent='Thank you. Your request was sent. The clinic will call you to confirm the time.';};
}).catch(()=>{m.innerHTML='<div class="card">The page could not be loaded.</div>';});})();
</script></body></html>
