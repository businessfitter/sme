<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Request for quotation</title><link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E242C;--muted:#5F6874;--line:#E3E6EA;--bg:#F4F6F8;--panel:#fff;--navy:#0E1B33;--teal:#0B8277;--bad:#B3261E;--ok:#1C7C4A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E8ECF2;--muted:#9AA4B2;--line:#2A3446;--bg:#0D131F;--panel:#141C2B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:18px 16px}header .in{max-width:860px;margin:auto}header b{font:600 1.15rem Sora,sans-serif}
main{max-width:860px;margin:20px auto;padding:0 16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h1{font:600 1.45rem/1.25 Sora,sans-serif;margin:0 0 4px}.mut{color:var(--muted)}table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.75rem;text-transform:uppercase;color:var(--muted)}
input,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}button{font:600 1rem "IBM Plex Sans",sans-serif;border-radius:10px;border:0;padding:12px 20px;cursor:pointer;background:var(--teal);color:#fff}button:disabled{opacity:.5}.msg{margin-top:10px;font-weight:500}
</style></head><body><header><div class="in"><b id="co">Request for quotation</b></div></header><main id="m"><div class="card">Loading…</div></main>
<script>
(function(){const t=new URLSearchParams(location.search).get('t')||'';const m=document.getElementById('m');const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('/api/rfq?t='+encodeURIComponent(t)).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{if(!ok){m.innerHTML='<div class="card">'+esc(j.error)+'</div>';return;}const R=j.rfq,c=j.company||{},iv=j.invite||{};document.getElementById('co').textContent=c.name||'Request for quotation';
 const done=iv.status==='quoted';const open=R.status==='open';
 m.innerHTML=`<div class="card"><div class="mut">${esc(R.number)} · quotations by ${esc(R.due||'')}</div><h1>${esc(R.title)}</h1><div class="mut">For ${esc(iv.supplier||'')}</div>${R.details?`<p style="white-space:pre-wrap">${esc(R.details)}</p>`:''}</div>
 <div class="card"><table><thead><tr><th>Item</th><th>Qty</th><th>Specification</th><th>Your unit price (${esc(R.currency||'')})</th></tr></thead><tbody>${(R.lines||[]).map((l,i)=>`<tr><td>${esc(l.desc)}</td><td>${esc(l.qty)} ${esc(l.unit||'')}</td><td class="mut">${esc(l.spec||'')}</td><td><input type="number" step="0.01" min="0" data-i="${i}" ${!open?'disabled':''} value="${done&&iv.quote&&iv.quote.lines&&iv.quote.lines[i]?esc(iv.quote.lines[i].price):''}"></td></tr>`).join('')}</tbody></table></div>
 ${open?`<div class="card"><h3>${done?'Update your quotation':'Your quotation'}</h3><div class="g"><label>Company<input id="co_" value="${esc(done?iv.quote.company:iv.supplier||'')}"></label><label>Contact name<input id="ct"></label><label>Email<input id="em" type="email"></label><label>Delivery (days)<input id="dd" type="number" min="0"></label><label>Payment terms (days)<input id="pd" type="number" min="0" value="30"></label><label>Valid for (days)<input id="vd" type="number" min="0" value="30"></label><label>Your quotation (PDF, optional)<input id="fl" type="file" accept="application/pdf,image/*"></label></div>
 <label style="margin-top:12px"><span><input type="checkbox" id="vi" style="width:auto"> Prices include VAT</span></label><label style="margin-top:8px">Notes<textarea id="nt"></textarea></label><div style="margin-top:12px"><button id="go">${done?'Update quotation':'Submit quotation'}</button></div><div class="msg" id="msg"></div></div>`:'<div class="card">This request is closed.</div>'}`;
 const go=document.getElementById('go');if(!go) return;go.onclick=async()=>{const msg=document.getElementById('msg');const lines=[...m.querySelectorAll('input[data-i]')].map(x=>({price:+x.value||0}));if(lines.some(l=>!(l.price>0))){msg.textContent='Enter a price for every item.';return;}
  let att=null,attName=null;const f=document.getElementById('fl').files[0];if(f){if(f.size>500000){msg.textContent='The file is too large (max 500 KB).';return;}att=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});attName=f.name;}
  go.disabled=true;const body={t,quote:{company:document.getElementById('co_').value,contact:document.getElementById('ct').value,email:document.getElementById('em').value,lines,delivery_days:document.getElementById('dd').value,payment_days:document.getElementById('pd').value,validity_days:document.getElementById('vd').value,vat_included:document.getElementById('vi').checked,notes:document.getElementById('nt').value,attachment:att,attachment_name:attName}};
  const r=await fetch('/api/rfq',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j2=await r.json().catch(()=>({}));if(!r.ok){msg.textContent=j2.error||'Could not submit.';go.disabled=false;return;}msg.style.color='var(--ok)';msg.textContent='Thank you. Your quotation was submitted. You can update it with this link until the deadline.';go.disabled=false;};
}).catch(()=>{m.innerHTML='<div class="card">Could not load. Check your connection.</div>';});})();
</script></body></html>
